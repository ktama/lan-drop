name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  release:
    runs-on: windows-latest
    needs: build-and-test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # タグと csproj の <Version> がずれていると、ローカルビルドとリリースで表示が食い違うため止める
      # （プレリリースタグ v1.2.0-rc.1 などは、"-" より前を比較する）
      - name: Check version matches csproj
        shell: pwsh
        run: |
          $tagVersion = '${{ steps.version.outputs.VERSION }}'
          $csproj = [xml](Get-Content src/LanDrop/LanDrop.csproj -Raw)
          $projVersion = @($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($projVersion -ne $tagVersion.Split('-')[0]) {
            Write-Error "Tag v$tagVersion does not match <Version>$projVersion</Version> in src/LanDrop/LanDrop.csproj"
            exit 1
          }

      # 配布物は exe と README / LICENSE / CHANGELOG のみ（pdb、web.config などは含めない）
      - name: Publish and package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          foreach ($rid in 'win-x64', 'win-x86', 'win-arm64') {
            dotnet publish src/LanDrop/LanDrop.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=$version -o "publish/$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $stage = "package/$rid"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "publish/$rid/lan-drop.exe", README.md, LICENSE, CHANGELOG.md -Destination $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "lan-drop-$version-$rid.zip"
          }

      - name: Build release notes from CHANGELOG.md
        shell: pwsh
        run: ./.github/scripts/New-ReleaseNotes.ps1 -Version '${{ steps.version.outputs.VERSION }}' -OutFile release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: LAN Drop v${{ steps.version.outputs.VERSION }}
          body_path: release-notes.md
          files: |
            lan-drop-${{ steps.version.outputs.VERSION }}-win-x64.zip
            lan-drop-${{ steps.version.outputs.VERSION }}-win-x86.zip
            lan-drop-${{ steps.version.outputs.VERSION }}-win-arm64.zip
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
